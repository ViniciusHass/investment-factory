id: INV-0002
title: Scaffold the approved React frontend with quality gates
status: BACKLOG
repository: investment-frontend
spec: specs/006-frontend-foundation/spec.md
roadmap: docs/frontend-roadmap.md
decision: docs/decisions/0001-frontend-stack.md
assignee_role: implementer
estimate: 2-3 working days
dependencies:
  - Owner accepts this card and its test expectations
  - Protected develop and main branches remain active
  - Frontend CI workflow is included in the implementation PR and passes
acceptance:
  - Vite, React and TypeScript strict mode start locally from a documented command
  - No portfolio data or financial-provider credentials are bundled into the app
  - npm lockfile is committed and install is reproducible with npm ci
  - Lint, typecheck, tests and build commands exist and pass locally and in CI
  - README explains local setup, commands, folder boundaries and how to add a feature
test_commands:
  - npm ci
  - npm run lint
  - npm run typecheck
  - npm run test -- --run
  - npm run build
definition_of_done:
  - Implemented in a worktree and branch created from frontend develop
  - CI passes on a PR targeting frontend develop
  - Sol reviews the diff and test evidence
  - No merge until the applicable authority authorizes it
